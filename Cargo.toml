[package]
name = "yap"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "A terminal client for YiffSpot, the anonymous furry roleplay chat (18+)"
license = "MIT"
authors = ["Syth"]
repository = "https://github.com/SythsSludge/yap"
homepage = "https://github.com/SythsSludge/yap"
readme = "README.md"
keywords = ["tui", "chat", "terminal", "roleplay", "ratatui"]
categories = ["command-line-utilities"]
# The upstream source is only there for reference while developing.
exclude = ["vendor/", "target/", ".github/", "packaging/"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
emojis = "0.9.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
linkify = "0.11.0"
open = "5.4.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spellbook = "0.4.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = "3.4.2"
url = "2.5.8"

[dev-dependencies]
insta = "1.48.0"
pretty_assertions = "1.4.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
